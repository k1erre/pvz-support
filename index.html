<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>📦 Полезное для поддержки ПВЗ</title>
    <style>
        /* ===== Светлая тема (по умолчанию) ===== */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-input: #f5f7fa;
            --bg-hover: #e8ecf1;
            --border-subtle: #d0d7de;
            --text-primary: #1a1f26;
            --text-secondary: #4a5568;
            --text-muted: #8a9aa8;
            --accent-blue: #4d8cf7;
            --accent-green: #28a745;
            --accent-green-bg: #d4edda;
            --accent-red: #dc3545;
            --accent-orange: #f0a030;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-card: 18px;
            --radius-box: 12px;
            --transition: 0.3s ease;
        }

        /* ===== Тёмная тема ===== */
        [data-theme="dark"] {
            --bg-body: #0e1217;
            --bg-card: #1a1f26;
            --bg-input: #262e36;
            --bg-hover: #2e3842;
            --border-subtle: #2e3842;
            --text-primary: #eef2f6;
            --text-secondary: #b0c0d0;
            --text-muted: #7a8a9a;
            --accent-blue: #4d8cf7;
            --accent-green: #3fcb6a;
            --accent-green-bg: #1a3a2a;
            --accent-red: #f77b7b;
            --accent-orange: #f0a030;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            transition: background var(--transition), color var(--transition);
        }

        .app {
            width: 100%;
            max-width: 560px;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow);
            padding: 24px 20px 26px;
            border: 1px solid var(--border-subtle);
            margin-top: 10px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        /* ===== Хедер с кнопкой темы ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 12px;
        }

        .title-center {
            text-align: center;
            flex: 1;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            transition: color var(--transition);
        }

        /* ===== Кнопка переключения темы ===== */
        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition), border-color var(--transition), transform 0.2s;
            flex-shrink: 0;
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            background: var(--bg-hover);
            transform: scale(1.05);
        }
        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* ===== Вкладки ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: var(--bg-input);
            border-radius: var(--radius);
            padding: 4px;
            flex-wrap: wrap;
            transition: background var(--transition);
        }

        .tab-btn {
            flex: 1;
            min-width: 70px;
            padding: 10px 6px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), color var(--transition), box-shadow var(--transition);
            text-align: center;
        }
        .tab-btn:hover {
            background: var(--bg-hover);
            color: var(--text-secondary);
        }
        .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
            box-shadow: 0 2px 8px rgba(77, 140, 247, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Общие элементы ===== */
        .field-group {
            margin-bottom: 12px;
        }
        .field-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
            transition: color var(--transition);
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-box);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            transition: border var(--transition), background var(--transition), color var(--transition), box-shadow var(--transition);
            outline: none;
            font-family: inherit;
        }
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(77, 140, 247, 0.15);
        }
        input[type="text"]::placeholder,
        textarea::placeholder {
            color: var(--text-muted);
        }
        select {
            appearance: none;
            cursor: pointer;
        }
        select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        textarea {
            resize: vertical;
            min-height: 60px;
            line-height: 1.5;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: var(--radius-box);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.08s, background var(--transition), box-shadow var(--transition), color var(--transition);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
            box-shadow: 0 2px 8px rgba(77, 140, 247, 0.25);
        }
        .btn-primary:hover {
            background: #5f99ff;
            box-shadow: 0 4px 12px rgba(77, 140, 247, 0.35);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-success {
            background: var(--accent-green);
            color: #fff;
            box-shadow: 0 2px 8px rgba(63, 203, 106, 0.25);
        }
        .btn-success:hover {
            background: #4fd87a;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 6px 0 12px;
        }
        .btn-group .btn {
            flex: 1;
            min-width: 80px;
        }

        /* ===== Центрирование кнопки ===== */
        .btn-center {
            display: flex;
            justify-content: center;
            margin: 10px 0 14px;
        }
        .btn-center .btn {
            width: auto;
            min-width: 200px;
        }

        /* ===== Блок вывода ===== */
        .output-block {
            margin-top: 10px;
        }
        .output-block label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
            transition: color var(--transition);
        }

        .output-area {
            width: 100%;
            min-height: 68px;
            padding: 10px 12px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-box);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            font-family: inherit;
            outline: none;
            transition: border var(--transition), background var(--transition), color var(--transition);
        }
        .output-area:focus {
            border-color: var(--accent-blue);
        }
        .output-area:disabled {
            opacity: 0.7;
            cursor: default;
        }

        .output-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        /* ===== Статус ===== */
        .status {
            margin-top: 12px;
            font-size: 13px;
            min-height: 22px;
            text-align: center;
            transition: opacity 0.2s;
        }
        .status.success {
            color: var(--accent-green);
        }
        .status.error {
            color: var(--accent-red);
        }
        .status:empty {
            opacity: 0;
        }

        /* ===== Чекбокс ===== */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 12px;
            padding: 6px 12px;
            background: var(--bg-input);
            border-radius: var(--radius-box);
            border: 1px solid var(--border-subtle);
            transition: background var(--transition), border-color var(--transition);
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-blue);
            cursor: pointer;
            flex-shrink: 0;
        }
        .checkbox-group label {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            transition: color var(--transition);
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
            margin-left: 6px;
        }
        .tag-zz {
            background: #4d8cf733;
            color: var(--accent-blue);
        }
        .tag-tech {
            background: #f0a03033;
            color: var(--accent-orange);
        }
        .tag-other {
            background: #3fcb6a33;
            color: var(--accent-green);
        }

        .phrase-box {
            min-height: 92px;
            padding: 18px 16px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-box);
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-muted);
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            word-break: break-word;
            transition: border-color var(--transition), background var(--transition), color var(--transition), box-shadow var(--transition);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .phrase-box.has-text {
            color: var(--text-primary);
            border-color: var(--border-subtle);
            background: var(--bg-input);
        }

        .phrase-box.copied {
            border-color: var(--accent-green);
            background: var(--accent-green-bg);
            box-shadow: 0 0 0 2px rgba(63, 203, 106, 0.15), inset 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .phrase-box:not(.has-text) {
            font-style: italic;
        }

        /* ===== Адаптив ===== */
        @media (max-width: 480px) {
            .app {
                padding: 16px;
            }
            h1 {
                font-size: 18px;
            }
            .btn {
                font-size: 13px;
                padding: 8px 14px;
            }
            .tab-btn {
                font-size: 12px;
                padding: 8px 4px;
                min-width: 55px;
            }
            .btn-group .btn {
                min-width: 60px;
                font-size: 12px;
                padding: 6px 10px;
            }
            .phrase-box {
                min-height: 76px;
                font-size: 15px;
                padding: 14px;
            }
            .btn-center .btn {
                min-width: 150px;
                width: 100%;
            }
            .theme-toggle {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== Хедер с кнопкой темы ===== -->
        <div class="header">
            <div class="title-center">
                <h1>📦 Полезное для поддержки ПВЗ</h1>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                🌙
            </button>
        </div>

        <!-- ===== Вкладки ===== -->
        <div class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="main">✏️ Генератор фраз</button>
            <button class="tab-btn" data-tab="temp">⏳ Временные ответы</button>
        </div>

        <!-- ============================================================ -->
        <!-- ВКЛАДКА 1: ГЕНЕРАТОР ФРАЗ -->
        <!-- ============================================================ -->
        <div class="tab-content active" id="tab-main">
            <div id="phraseBox" class="phrase-box">
                Нажмите «Сгенерировать и скопировать», чтобы получить и скопировать фразу
            </div>

            <div class="btn-center">
                <button id="generateBtn" class="btn btn-primary">Сгенерировать и скопировать</button>
            </div>

            <div id="status" class="status"></div>
        </div>

        <!-- ============================================================ -->
        <!-- ВКЛАДКА 2: ВРЕМЕННЫЕ ОТВЕТЫ -->
        <!-- ============================================================ -->
        <div class="tab-content" id="tab-temp">
            <div class="field-group">
                <label for="tempCategory">Категория</label>
                <select id="tempCategory">
                    <option value="all">— Все —</option>
                    <option value="zz">По заказам (ЗЗ)</option>
                    <option value="tech">Технические проблемы</option>
                    <option value="other">Вне тем</option>
                </select>
            </div>

            <div class="field-group">
                <label for="tempPhraseSelect">Выберите фразу</label>
                <select id="tempPhraseSelect">
                    <option value="">— Выберите —</option>
                </select>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="tempAddGreeting" />
                <label for="tempAddGreeting">Добавить «Здравствуйте!» в начало</label>
            </div>

            <div class="btn-group">
                <button class="btn btn-success btn-sm" id="tempCopyBtn">📋 Скопировать</button>
            </div>

            <div class="output-block">
                <label>Выбранный ответ</label>
                <textarea class="output-area" id="tempOutput" readonly placeholder="Здесь появится выбранный ответ…"></textarea>
            </div>

            <div id="tempStatus" class="status"></div>
        </div>

    </div>

    <script>
        // ================================================================
        //  ПЕРЕКЛЮЧЕНИЕ ТЕМЫ
        // ================================================================

        const themeToggle = document.getElementById('themeToggle');

        function getPreferredTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return 'dark';
            }
            return 'light';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        setTheme(getPreferredTheme());

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
        });

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    setTheme(e.matches ? 'dark' : 'light');
                }
            });
        }

        // ================================================================
        //  ДАННЫЕ
        // ================================================================

        // ---- Основные фразы ----
        const MAIN_PHRASES = [
            'Желаем хорошего дня! 😊',
            'Спасибо за обращение — будем рады помочь снова! 😊',
            'Надеемся, что всё получилось. Если возникнут новые вопросы — мы на связи! 💛',
            'Пишите, если что-то понадобится — всегда рады быть полезными! 😊',
            'Надеемся, решение оказалось полезным. Желаем хорошего дня! 🍀'
        ];

        // ---- Временные ответы ----
        const TEMP_PHRASES = [
            // ЗЗ
            { text: 'Мне нужно время, чтобы разобраться с вашим заказом. Пожалуйста, оставайтесь на связи. Я сразу сообщу вам, как только появятся новые данные', category: 'zz' },
            { text: 'Мне потребуется некоторое время, чтобы разобраться с вашим заказом. Пожалуйста, оставайтесь на связи. Как только у меня появятся новые данные, я сразу же сообщу вам об этом', category: 'zz' },
            { text: 'Мне нужно еще немного времени, чтобы разобраться в ситуации с заказом. Оставайтесь на связи, напишу вам, когда все узнаю', category: 'zz' },
            // Вне тем
            { text: 'Мы делаем всё возможное, чтобы как можно скорее решить данный вопрос. Оставайтесь на связи, напишу вам, когда все узнаю', category: 'other' },
            { text: 'Мы прилагаем все усилия, чтобы как можно быстрее решить эту проблему. Пожалуйста, оставайтесь на связи. Я сообщу вам, как только появится новая информация', category: 'other' },
            { text: 'Мы делаем все возможное, чтобы как можно скорее решить этот вопрос. Пожалуйста, оставайтесь на связи. Как только у нас будет новая информация, я сразу же вам сообщу. Приносим свои извинения за ожидание', category: 'other' },
            { text: 'Я вместе со специалистами уже разбираюсь в решении вопроса, вернусь с ответом в ближайшее время. Простите за ожидание', category: 'other' },
            // Технические
            { text: 'Проблема находится в процессе решения у разработчиков. Как только она будет исправлена, мы с вами свяжемся. Простите, что приходится ждать', category: 'tech' },
            { text: 'Разработчики активно работают над решением проблемы. Как только она будет устранена, мы свяжемся с вами. Приносим извинения за ожидание', category: 'tech' },
            { text: 'Мы с техническими специалистами ещё работаем над проблемой с заказом ХХХ. Сообщу вам сразу же, как только всё узнаю', category: 'tech' },
            { text: 'Мы с техническими специалистами продолжаем работать над заказом ХХХ. Как только что-то прояснится, сразу сообщу', category: 'tech' },
            { text: 'Мы на завершающем этапе в решении вашего вопроса, связанного с заказом. Приносим извинения за задержку', category: 'tech' },
            { text: 'С решением вашего вопроса по поводу заказа мы уже на финишной прямой. Простите, что задерживаемся', category: 'tech' },
            { text: 'Понимаю, как вам важно получить ответ быстро, но, к сожалению, пока что информации от коллег из технического отдела не поступило. Вернусь, как только всё узнаю', category: 'tech' },
            { text: 'Я понимаю, насколько важно для вас получить ответ как можно скорее. К сожалению, пока что я не получил информацию от коллег из технического отдела. Я обязательно вернусь к вам, как только узнаю что-то новое', category: 'tech' },
        ];

        // ================================================================
        //  УТИЛИТЫ
        // ================================================================

        function copyText(text) {
            if (!text) return false;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => true).catch(() => false);
                return true;
            }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                return true;
            } catch (_) {
                return false;
            }
        }

        function showStatus(el, msg, type) {
            el.textContent = msg;
            el.className = 'status' + (type ? ' ' + type : '');
            if (msg) {
                clearTimeout(el._timer);
                el._timer = setTimeout(() => {
                    el.textContent = '';
                    el.className = 'status';
                }, 3500);
            }
        }

        function getCategoryLabel(cat) {
            const map = { 'zz': 'ЗЗ', 'tech': 'Технические', 'other': 'Вне тем' };
            return map[cat] || cat;
        }

        // ================================================================
        //  ВКЛАДКИ
        // ================================================================

        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = {
            main: document.getElementById('tab-main'),
            temp: document.getElementById('tab-temp'),
        };

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                Object.keys(tabContents).forEach(key => {
                    tabContents[key].classList.toggle('active', key === btn.dataset.tab);
                });
            });
        });

        // ================================================================
        //  ВКЛАДКА 1: ГЕНЕРАТОР ФРАЗ
        // ================================================================

        const phraseBox = document.getElementById('phraseBox');
        const generateBtn = document.getElementById('generateBtn');
        const statusEl = document.getElementById('status');

        let currentPhrase = '';
        let previousPhrase = '';

        function getRandomPhrase() {
            if (MAIN_PHRASES.length === 1) return MAIN_PHRASES[0];
            if (previousPhrase === '') {
                return MAIN_PHRASES[Math.floor(Math.random() * MAIN_PHRASES.length)];
            }
            let newPhrase;
            let attempts = 0;
            const maxAttempts = 100;
            do {
                newPhrase = MAIN_PHRASES[Math.floor(Math.random() * MAIN_PHRASES.length)];
                attempts++;
                if (attempts > maxAttempts) {
                    const currentIndex = MAIN_PHRASES.indexOf(previousPhrase);
                    if (currentIndex !== -1 && currentIndex + 1 < MAIN_PHRASES.length) {
                        return MAIN_PHRASES[currentIndex + 1];
                    } else {
                        return MAIN_PHRASES[0];
                    }
                }
            } while (newPhrase === previousPhrase);
            return newPhrase;
        }

        generateBtn.addEventListener('click', async () => {
            const newPhrase = getRandomPhrase();
            currentPhrase = newPhrase;
            previousPhrase = newPhrase;

            phraseBox.textContent = currentPhrase;
            phraseBox.classList.add('has-text');
            phraseBox.classList.remove('copied');

            try {
                await navigator.clipboard.writeText(currentPhrase);
                phraseBox.classList.add('copied');
                showStatus(statusEl, 'Фраза скопирована в буфер! ✅', 'success');
            } catch (err) {
                console.warn('Ошибка копирования:', err);
                showStatus(statusEl, 'Не удалось скопировать. Проверьте права доступа. ❌', 'error');
                phraseBox.classList.remove('copied');
            }
        });

        showStatus(statusEl, '');
        previousPhrase = '';

        // ================================================================
        //  ВКЛАДКА 2: ВРЕМЕННЫЕ ОТВЕТЫ
        // ================================================================

        const tempCategory = document.getElementById('tempCategory');
        const tempPhraseSelect = document.getElementById('tempPhraseSelect');
        const tempAddGreeting = document.getElementById('tempAddGreeting');
        const tempCopyBtn = document.getElementById('tempCopyBtn');
        const tempOutput = document.getElementById('tempOutput');
        const tempStatus = document.getElementById('tempStatus');

        // Функция обновления списка фраз при смене категории
        function populateTempPhrases() {
            const category = tempCategory.value;
            let filtered = TEMP_PHRASES;
            if (category !== 'all') {
                filtered = TEMP_PHRASES.filter(p => p.category === category);
            }
            tempPhraseSelect.innerHTML = '<option value="">— Выберите —</option>';
            filtered.forEach((p, index) => {
                const option = document.createElement('option');
                option.value = index;
                const label = p.text.length > 60 ? p.text.slice(0, 57) + '…' : p.text;
                option.textContent = `[${getCategoryLabel(p.category)}] ${label}`;
                tempPhraseSelect.appendChild(option);
            });
            
            // Очищаем вывод при смене категории
            tempOutput.value = '';
            tempOutput.disabled = true;
        }

        // Событие смены категории
        tempCategory.addEventListener('change', populateTempPhrases);
        
        // Событие выбора фразы — сразу показываем в поле вывода
        tempPhraseSelect.addEventListener('change', function() {
            const index = parseInt(this.value);
            if (isNaN(index) || index < 0 || index >= TEMP_PHRASES.length) {
                tempOutput.value = '';
                tempOutput.disabled = true;
                return;
            }
            
            const phrase = TEMP_PHRASES[index];
            let text = phrase.text;
            if (tempAddGreeting.checked) {
                text = 'Здравствуйте!\n\n' + text;
            }
            
            tempOutput.value = text;
            tempOutput.disabled = false;
            showStatus(tempStatus, '', '');
        });

        // Событие чекбокса — обновляем текст, если фраза уже выбрана
        tempAddGreeting.addEventListener('change', function() {
            const index = parseInt(tempPhraseSelect.value);
            if (isNaN(index) || index < 0 || index >= TEMP_PHRASES.length) {
                return;
            }
            
            const phrase = TEMP_PHRASES[index];
            let text = phrase.text;
            if (this.checked) {
                text = 'Здравствуйте!\n\n' + text;
            }
            
            tempOutput.value = text;
        });

        // Кнопка копирования
        tempCopyBtn.addEventListener('click', async () => {
            const text = tempOutput.value;
            if (!text) {
                showStatus(tempStatus, 'Сначала выберите фразу', 'error');
                return;
            }
            
            try {
                await navigator.clipboard.writeText(text);
                showStatus(tempStatus, 'Скопировано! ✅', 'success');
            } catch (err) {
                // Fallback
                const ok = copyText(text);
                showStatus(tempStatus, ok ? 'Скопировано! ✅' : 'Ошибка копирования ❌', ok ? 'success' : 'error');
            }
        });

        // Инициализация: блокируем вывод
        tempOutput.disabled = true;
        populateTempPhrases();

        console.log('✅ Приложение "📦 Полезное для поддержки ПВЗ" загружено');
    </script>

</body>
</html>
